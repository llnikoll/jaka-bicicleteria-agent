services:
  - type: web
    name: jaka-bicicleteria-agent-test
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WHATSAPP_PROVIDER
        value: zernio
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: DATABASE_URL
        fromDatabase:
          name: jaka-bicicleteria-db-test
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ZERNIO_API_KEY
        sync: false
      - key: ZERNIO_WEBHOOK_SECRET
        sync: false

databases:
  - name: jaka-bicicleteria-db-test
    plan: free
    region: virginia
